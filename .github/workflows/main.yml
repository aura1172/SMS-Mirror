name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the zip
        run: |
          zipfile=$(ls *.zip | head -1)
          [ -n "$zipfile" ] || { echo "NO ZIP FOUND: upload sms-bridge.zip to the repository"; exit 1; }
          mkdir -p src && unzip -q -o "$zipfile" -d src
          root=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          [ -f "$root/app/build.gradle.kts" ] || { echo "BAD ZIP: app folder missing inside the zip"; exit 1; }
          echo "PROJECT_ROOT=$root" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }
      - name: Build
        run: cd "$PROJECT_ROOT" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SmsBridge-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
